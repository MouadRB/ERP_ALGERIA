name: Engine A CI

on:
  push:
    paths:
      - 'engine-a/**'
      - 'mdm-service/**'
  pull_request:
    paths:
      - 'engine-a/**'
      - 'mdm-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test Engine A
        working-directory: engine-a
        run: mvn clean verify

      - name: Build and test MDM Service
        working-directory: mdm-service
        run: mvn clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-a-test-results
          path: |
            engine-a/target/surefire-reports/
            mdm-service/target/surefire-reports/
