name: OCR Service CI

on:
  push:
    paths:
      - 'Ocr-service/**'
      - '.github/workflows/ocr-service-ci.yml'
  pull_request:
    paths:
      - 'Ocr-service/**'
      - '.github/workflows/ocr-service-ci.yml'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Ocr-service/requirements.txt'

      - name: Install dependencies
        working-directory: Ocr-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: Ocr-service
        run: python -m compileall main.py ocr_engine.py

      - name: Validate FastAPI app import
        working-directory: Ocr-service
        run: |
          python -c "from main import app; assert app.title == 'OCR Delivery Note Service'"
