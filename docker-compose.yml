version: '3.8'

# Brings up the Engine A (PIM/Catalogue) stack + BFF.
# Engine B (ASP.NET) runs locally; the BFF reaches it via host.docker.internal.
#
# Run from the project root:
#   docker compose up --build
#
# Ports exposed on the host (chosen to avoid clashing with local services):
#   5433  → PostgreSQL (Engine A / MDM share one DB)
#   6380  → Redis
#   9200  → OpenSearch
#   8081  → MDM service
#   8082  → Engine A  (PIM: /pim/v1/*, Catalogue: /catalog/v1/*)
#   4001  → BFF       (all /bff/* routes)

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: erp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: erp-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # ── Application services ─────────────────────────────────────────────────────

  mdm-service:
    build:
      context: ./mdm-service
      dockerfile: Dockerfile
    container_name: erp-mdm-service
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
      - ERP_JWT_SECRET=changeme-in-production-use-256-bit-minimum-key-here-please
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  engine-a:
    build:
      context: ./engine-a
      dockerfile: Dockerfile
    container_name: erp-engine-a
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
      - MDM_BASE_URL=http://mdm-service:8080
      - OMS_MDM_BASE_URL=http://mdm-service:8080
      - PIM_BASE_URL=http://engine-a:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CATALOG_OPENSEARCH_HOST=opensearch
      - CATALOG_OPENSEARCH_PORT=9200
      - CATALOG_OPENSEARCH_SCHEME=http
      - ERP_JWT_SECRET=changeme-in-production-use-256-bit-minimum-key-here-please
      - JWT_SECRET=changeme-in-production-use-256-bit-minimum-key-here-please
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mdm-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  bff:
    build:
      context: ./frontend/apps/bff
      dockerfile: Dockerfile
    container_name: erp-bff
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - USE_MOCK=false
      - AUTH_USE_MOCK=false
      # Engine A runs as a sibling container
      - ENGINE_A_URL=http://engine-a:8080
      - MDM_URL=http://mdm-service:8080
      # Engine B runs on the Docker host (Windows: host.docker.internal)
      - ENGINE_B_URL=http://host.docker.internal:5220
      # Must match Engine A's ERP_JWT_SECRET so BFF-issued tokens are accepted
      - ERP_JWT_SECRET=changeme-in-production-use-256-bit-minimum-key-here-please
      - JWT_SECRET=changeme-in-production-use-256-bit-minimum-key-here-please
      # Engine B JWT verification (shared secret — no network call needed)
      - ENGINE_B_JWT_ISSUER=engine-b
      - ENGINE_B_JWT_AUDIENCE=erp-algeria-clients
      # CORS: allow the locally-running Next.js frontend
      - CORS_ORIGIN=http://localhost:3001,http://localhost:3000,http://localhost:5173
      # Dev fallback user (used only when AUTH_USE_MOCK=true)
      - MOCK_USER_ROLE=SUPERADMIN
      - MOCK_USER_ID=usr-dev-001
      - MOCK_USER_NAME_FR=Haroun
    depends_on:
      engine-a:
        condition: service_started

volumes:
  pgdata:
  opensearch-data:
