services:


  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: erp-opensearch
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: erp-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/erp_db
      KC_DB_USERNAME: erp_admin
      KC_DB_PASSWORD: local_dev_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ../auth/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy


  # APPLICATION SERVICES

  mdm-service:
    build:
      context: ../mdm-service
      dockerfile: Dockerfile
    container_name: erp-mdm-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  engine-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-engine-a
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
      - MDM_BASE_URL=http://mdm-service:8081
      - OMS_MDM_BASE_URL=http://mdm-service:8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OMS_OPENSEARCH_HOST=opensearch
      - OMS_OPENSEARCH_PORT=9200
      - OMS_OPENSEARCH_SCHEME=http
      - CATALOG_OPENSEARCH_HOST=opensearch
      - CATALOG_OPENSEARCH_PORT=9200
      - CATALOG_OPENSEARCH_SCHEME=http
    depends_on:
      postgres:
        condition: service_healthy
      mdm-service:
        condition: service_started


volumes:
  pgdata:
  opensearch-data:
