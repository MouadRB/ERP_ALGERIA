services:

  # BACKING INFRASTRUCTURE

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: erp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: erp-opensearch
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: erp-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/erp_db
      KC_DB_USERNAME: erp_admin
      KC_DB_PASSWORD: local_dev_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ../auth/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy


  # APPLICATION SERVICES

  mdm-service:
    build:
      context: ../../mdm-service
      dockerfile: Dockerfile
    container_name: erp-mdm-service
    # mdm-service binds to 8081 internally (server.port in application.yml),
    # NOT 8080. Mapping must match or the host can't reach it.
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  engine-a:
    build:
      context: ../../engine-a
      dockerfile: Dockerfile
    container_name: erp-engine-a
    # engine-a binds to 8082 internally (server.port in application.yml).
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/erp_db
      - SPRING_DATASOURCE_USERNAME=erp_admin
      - SPRING_DATASOURCE_PASSWORD=local_dev_password
      # mdm-service listens on 8081 internally. Match it explicitly.
      - MDM_SERVICE_URL=http://mdm-service:8081
      - MDM_BASE_URL=http://mdm-service:8081
      - OMS_MDM_BASE_URL=http://mdm-service:8081
      - PIM_BASE_URL=http://localhost:8080
      - ENGINE_B_URL=http://engine-b:8080
      - REDIS_HOST=redis
      - OPENSEARCH_URIS=http://opensearch:9200
      - OCR_BASE_URL=http://host.docker.internal:8085
      # Shared JWT secret — must match every service that mints or validates
      # cross-service tokens (engine-b's ServiceTokenProvider, mdm-service).
      - JWT_SECRET=${ERP_JWT_SECRET:-changeme-in-production-use-256-bit-minimum-key-here-please}
    depends_on:
      postgres:
        condition: service_healthy
      mdm-service:
        condition: service_started

  engine-b:
    build:
      context: ../../engine-b
      dockerfile: Dockerfile
    container_name: erp-engine-b
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=erp_db;Username=erp_admin;Password=local_dev_password;
      # Config keys must match what Program.cs / appsettings.json read:
      #   builder.Configuration["Integrations:EngineA:BaseUrl"]
      #   builder.Configuration["Integrations:Mdm:BaseUrl"]
      # ASP.NET Core maps `__` in env vars onto the `:` config separator.
      - Integrations__EngineA__BaseUrl=http://engine-a:8082
      - Integrations__Mdm__BaseUrl=http://mdm-service:8081
      # Shared JWT secret — ServiceTokenProvider reads ERP_JWT_SECRET (or
      # Jwt:Key as a fallback). Engine-A and mdm-service must read the same
      # value so JWTs minted here validate at the receiving end.
      - ERP_JWT_SECRET=${ERP_JWT_SECRET:-changeme-in-production-use-256-bit-minimum-key-here-please}
      - Jwt__Key=${ERP_JWT_SECRET:-changeme-in-production-use-256-bit-minimum-key-here-please}
    depends_on:
      postgres:
        condition: service_healthy
      mdm-service:
        condition: service_started
    healthcheck:
      # /api/auth/login is AllowAnonymous and returns a 4xx (not 5xx) without
      # credentials — that's enough to prove the listener is up. Anything in
      # the 200-499 range is treated as "ready" by curl's exit code check.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login -X POST -H 'Content-Type: application/json' -d '{}' | grep -qE '^(2|4)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


volumes:
  pgdata:
  opensearch-data:
