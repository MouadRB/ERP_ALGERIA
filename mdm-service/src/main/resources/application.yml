server:
  port: ${SERVER_PORT:8081}


spring:
  application:
    name: erp
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/erp_db
    username: ${DB_USERNAME:erp_admin}
    password: ${DB_PASSWORD:local_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Algiers


jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    jwt:
      # Shared HMAC secret used by engine-a, mdm-service and engine-b so JWTs
      # issued by any side validate everywhere. Override in every environment.
      secret: ${ERP_JWT_SECRET:${JWT_SECRET:changeme-in-production-use-256-bit-minimum-key-here-please}}
      expiration-ms: 900000

  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    retry-max: 3
    timeout-ms: 5000

    # MDM only emits SKU_*/SUPPLIER_* style master-data events for engine-b.
    # Single target — DEFAULT routes everything to engine-b's ingest endpoint.
    targets:
      - name: engine-b
        routes:
          DEFAULT: ${ENGINE_B_INGEST_URL:http://localhost:8082/api/events/ingest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.dz.erp: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
